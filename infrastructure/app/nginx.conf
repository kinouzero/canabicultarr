user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # OAuth codes, activation tokens and private search criteria must not enter access logs.
    log_format app '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout app;
    sendfile on;
    server_tokens off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $upstream_http_content_security_policy $browser_policy {
        default "";
        "" "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://gravatar.com https://www.gravatar.com https://cdn.jsdelivr.net; font-src 'self' data:; connect-src $browser_connect_src; frame-src 'self' blob:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    }
    server {
        listen 8420;
        client_max_body_size 12m;
        include /etc/nginx/browser-security.conf;
        location = /api/v1/auth/oidc/callback {
            # Nginx error diagnostics include the raw URI; use redacted access status
            # and the application's sanitized authentication errors for this endpoint.
            error_log /dev/null;
            include /etc/nginx/php-request.conf;
        }
        location ~ ^/(api(?:/|$)|up$) { include /etc/nginx/php-request.conf; }
        location ~ /\. { deny all; }
        location ~ \.php(?:/|$) { return 404; }
        include /etc/nginx/app-ui.conf;
    }
}
