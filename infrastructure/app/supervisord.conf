[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:php]
command=php-fpm --nodaemonize --allow-to-run-as-root
priority=10
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:web]
command=nginx -g 'daemon off;'
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:scheduler]
command=php artisan schedule:work --no-interaction
directory=/var/www/html
user=%(ENV_APP_PROCESS_USER)s
autostart=%(ENV_APP_SCHEDULER_ENABLED)s
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=35
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:mqtt]
command=app-mqtt
directory=/var/www/html
user=%(ENV_APP_PROCESS_USER)s
autostart=%(ENV_APP_MQTT_WORKER_ENABLED)s
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:vite]
command=node /app/node_modules/vite/bin/vite.js --host 0.0.0.0
directory=/app
user=%(ENV_APP_PROCESS_USER)s
autostart=%(ENV_APP_DEV_SERVER)s
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:queue]
command=php artisan queue:work --queue=password-recovery,account-activation,controls,default --sleep=3 --tries=3 --timeout=60 --max-time=3600 --no-interaction
directory=/var/www/html
user=%(ENV_APP_PROCESS_USER)s
autostart=%(ENV_APP_QUEUE_WORKER_ENABLED)s
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=70
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:integrations]
command=php artisan queue:work --queue=integrations --sleep=3 --tries=3 --timeout=60 --max-time=3600 --no-interaction
directory=/var/www/html
user=%(ENV_APP_PROCESS_USER)s
autostart=%(ENV_APP_QUEUE_WORKER_ENABLED)s
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=70
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:exports]
command=php artisan queue:work --queue=exports --sleep=3 --tries=3 --timeout=60 --max-time=3600 --no-interaction
directory=/var/www/html
user=%(ENV_APP_PROCESS_USER)s
autostart=%(ENV_APP_QUEUE_WORKER_ENABLED)s
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=70
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:pump-timers]
command=php artisan pumps:work --max-seconds=3600 --no-interaction
directory=/var/www/html
user=%(ENV_APP_PROCESS_USER)s
autostart=%(ENV_APP_SCHEDULER_ENABLED)s
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
