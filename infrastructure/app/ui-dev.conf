# Vite's optimized browser dependencies are generated assets, not private files.
set $browser_connect_src "'self' ws: wss:";
# This development-only prefix takes precedence over the global dotfile deny rule.
location ^~ /node_modules/.vite/deps/ {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
}
location / {
    proxy_pass http://127.0.0.1:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
