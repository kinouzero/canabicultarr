root /var/www/frontend;
set $browser_connect_src "'self'";
location / { try_files $uri $uri/ /index.html; }
location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/browser-security.conf;
}
location = /index.html { add_header Cache-Control "no-cache"; include /etc/nginx/browser-security.conf; }
location = /sw.js { add_header Cache-Control "no-cache"; include /etc/nginx/browser-security.conf; }
